events {
    worker_connections 4096;
}

http {
    access_log off;

    # Three server replicas, round-robined. keepalive holds upstream
    # connections open so the proxy isn't paying a TCP handshake per request.
    upstream dispatchd {
        server server1:8080;
        server server2:8080;
        server server3:8080;
        keepalive 64;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://dispatchd;

            # Both lines are required for upstream keepalive to apply.
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}