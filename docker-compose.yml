services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dispatchd
      POSTGRES_PASSWORD: dispatchd
      POSTGRES_DB: dispatchd
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatchd"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Three independent server processes sharing one database. Named
  # explicitly rather than scaled, so the load balancer can address them
  # stably and one can be killed by name to test failover.
  server1: &server
    build: .
    command: ["/app/server", "-lease", "30s", "-db", "postgres://dispatchd:dispatchd@postgres:5432/dispatchd"]
    networks:
      default:
        # All three replicas answer to this name, so Docker DNS hands
        # workers a different one each time and the hot path skips the proxy.
        aliases:
          - servers
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  server2: *server
  server3: *server

  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      server1:
        condition: service_healthy
      server2:
        condition: service_healthy
      server3:
        condition: service_healthy

  worker:
    build: .
    command: ["/app/worker", "-server", "http://servers:8080"]
    depends_on:
      lb:
        condition: service_started
    deploy:
      replicas: 6

volumes:
  pgdata: