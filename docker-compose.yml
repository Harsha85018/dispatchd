services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dispatchd
      POSTGRES_PASSWORD: dispatchd
      POSTGRES_DB: dispatchd
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatchd"]
      interval: 3s
      timeout: 3s
      retries: 10

  server:
    build: .
    command: ["/app/server", "-lease", "30s", "-db", "postgres://dispatchd:dispatchd@postgres:5432/dispatchd"]
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build: .
    command: ["/app/worker", "-server", "http://server:8080"]
    depends_on:
      server:
        condition: service_healthy
    deploy:
      replicas: 2

volumes:
  pgdata: